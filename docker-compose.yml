version: '3.8'

services:
  recruit-el-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruit-el-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - supabase_network_supabase_BKyh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  supabase_network_supabase_BKyh:
    external: true
