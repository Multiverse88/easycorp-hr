name: Deploy to Dokku
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via webhook
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKKU_DEPLOY_TOKEN }}" \
            https://panel.easylegal.my.id/recruit-deploy \
            -d '{}'
